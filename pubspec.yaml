name: card_memory_game_three
description: "Tercera version del game card memory aplicando clean code desde el inicio."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flip_card: ^0.7.0
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  provider: ^6.1.5+1

dev_dependencies:
  build_runner: ^2.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^1.1.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/animals/
    - assets/images/colors/
    - assets/images/numbers/
    - assets/images/ui/
